services:
  - type: web
    name: aimobil
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node server/index.cjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_API_URL
        value: "https://aimobil.onrender.com"
      - key: PORT
        value: 10000
      - key: ALLOWED_ORIGINS
        value: "https://iamobil-frontend.pages.dev,https://aimobil.onrender.com"
      - key: BCRYPT_ROUNDS
        value: 12
      - key: RATE_LIMIT_WINDOW
        value: 900000
      - key: RATE_LIMIT_MAX
        value: 100
      - key: LOG_LEVEL
        value: info
      - key: TURSO_DATABASE_URL
        value: "libsql://alma-edyinvesti.aws-us-west-2.turso.io"
      # ⚠️ Preencha estas variáveis no painel do Render (não colocar valores sensíveis aqui)
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # ══════════════════════════════════════════
      # MARKETING ENGINE — Meta Ads (preencher no painel)
      - key: META_ADS_ACCESS_TOKEN
        sync: false
      - key: META_ADS_AD_ACCOUNT_ID
        sync: false
      - key: META_FACEBOOK_PAGE_ID
        sync: false
      - key: INSTAGRAM_BUSINESS_ID
        sync: false
      - key: INSTAGRAM_ACCESS_TOKEN
        sync: false
