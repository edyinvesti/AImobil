services:
  - type: web
    name: aimobil
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node server/index.cjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_API_URL
        value: "https://aimobil.onrender.com"
      - key: FRONTEND_URL
        value: "https://iamobil-frontend.pages.dev"
      - key: PORT
        value: 10000
      - key: ALLOWED_ORIGINS
        value: "https://iamobil-frontend.pages.dev,https://aimobil.onrender.com"
      - key: BCRYPT_ROUNDS
        value: 12
      - key: RATE_LIMIT_WINDOW
        value: 900000
      - key: RATE_LIMIT_MAX
        value: 100
      - key: LOG_LEVEL
        value: info
      # ══════════════════════════════════════════
      # DATABASE — Turso (iamobil)
      - key: TURSO_DATABASE_URL
        value: "libsql://iamobil-edyinvesti.aws-us-west-2.turso.io"
      - key: TURSO_AUTH_TOKEN
        sync: false
      # ══════════════════════════════════════════
      # AUTH — JWT
      - key: JWT_SECRET
        sync: false
      # ══════════════════════════════════════════
      # AI — LLM Providers
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      # ══════════════════════════════════════════
      # TELEGRAM
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      # ══════════════════════════════════════════
      # STORAGE — Cloudflare R2
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        value: "iamobil-images"
      - key: R2_PUBLIC_URL
        sync: false
      # ══════════════════════════════════════════
      # MARKETING — Meta Ads
      - key: META_ADS_ACCESS_TOKEN
        sync: false
      - key: META_ADS_AD_ACCOUNT_ID
        sync: false
      - key: META_FACEBOOK_PAGE_ID
        sync: false
      - key: INSTAGRAM_BUSINESS_ID
        sync: false
      - key: INSTAGRAM_ACCESS_TOKEN
        sync: false
